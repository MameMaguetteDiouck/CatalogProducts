services:
  mongodb:
    image: mongo:7.0
    container_name: catalog_mongodb_standalone
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_secret_password
      MONGO_INITDB_DATABASE: catalog_db
      MONGODB_USER: catalog_user
      MONGODB_PASSWORD: catalog_secret
    volumes:
      - mongo_standalone_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - catalog_db_network

  mongo-express:
    image: mongo-express:latest
    container_name: catalog_mongo_express_standalone
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin_secret_password
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin_secret_password@mongodb:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: express_password_123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - catalog_db_network

volumes:
  mongo_standalone_data:
    driver: local

networks:
  catalog_db_network:
    driver: bridge
