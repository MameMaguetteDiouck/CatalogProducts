services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_node_modules:/var/www/html/node_modules
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mongodb
      - MONGODB_URI=mongodb://catalog_user:catalog_secret@mongodb:27017/catalog_db?authSource=catalog_db
      - MONGODB_DATABASE=catalog_db
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - catalog_network

  mongodb:
    image: mongo:7.0
    container_name: catalog_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_secret_password
      MONGO_INITDB_DATABASE: catalog_db
      MONGODB_USER: catalog_user
      MONGODB_PASSWORD: catalog_secret
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - catalog_network

  mongo-express:
    image: mongo-express:latest
    container_name: catalog_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin_secret_password
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin_secret_password@mongodb:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: express_password_123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - catalog_network

volumes:
  mongo_data:
    name: catalog_mongo_data
  mongo_config:
    name: catalog_mongo_config
  app_vendor:
    name: catalog_app_vendor
  app_node_modules:
    name: catalog_app_node_modules

networks:
  catalog_network:
    driver: bridge
